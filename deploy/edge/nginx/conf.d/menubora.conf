# Servidor do menubora.com.br (ADR 0006, matriz M01 a M23).

# M16: qualquer outro nome de host, ou acesso direto por IP, é recusado já no handshake TLS.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name menubora.com.br;

    # Certificado de ORIGEM (Cloudflare Origin CA, decidido no ABERTO-21). Os arquivos ficam FORA do
    # repositório, no diretório indicado por CERTS_DIR no Compose da borda. Nunca versionar chaves.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # M04: Authenticated Origin Pulls. O modo (optional ou on) fica em snippets/aop-mode.conf e muda
    # para "on" só na F8-B9, depois de comprovado que o proxy e o AOP funcionam.
    ssl_client_certificate /etc/nginx/certs/aop-client-ca.pem;
    ssl_verify_depth 2;
    include /etc/nginx/snippets/aop-mode.conf;

    include /etc/nginx/snippets/security-headers.conf;

    # Corpo pequeno por padrão; só as duas rotas de imagem aceitam 6 MB (M17, igual ao bodyparser).
    client_max_body_size 128k;
    limit_conn perip 40;

    # Resolve os nomes do Docker em tempo de execução: o Nginx sobe mesmo com a pilha do projeto parada.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream "cardapio-web:3000";
    set $api_upstream "cardapio-api:3333";

    # M22: em produção as imagens saem de img.menubora.com.br; a rota /uploads existe só em desenvolvimento.
    location /uploads/ {
        return 404;
    }

    # Upload de imagem (ADR 0003): 6 MB só nestas duas rotas.
    location ~ ^/api/v1/tenant/[^/]+/(products/[^/]+/image|restaurant/logo)$ {
        client_max_body_size 6m;
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # API na mesma origem (ADR 0002, ABERTO-17): sem CORS, sem subdomínio.
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://$api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Sem proxy_cache em nenhuma rota (M13): nada de resposta autenticada ou com dado pessoal guardada aqui.
    location / {
        limit_req zone=web burst=60 nodelay;
        proxy_pass http://$web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
