# Nginx da borda (ADR 0006, arquitetura B; matriz de responsabilidade M01 a M23).
# Imagem nginxinc/nginx-unprivileged: sem root, escuta em 8443 (o Compose publica 443 -> 8443).
# O Nginx recebe o tráfego da Cloudflare com TLS Full (strict) e autentica a Cloudflare pelo AOP.
# Valores numéricos (limites, tempos) são PROPOSTAS INICIAIS, a validar na F8-B13.

worker_processes auto;
pid /tmp/nginx.pid;

# ABERTO-04 (proposta, aguarda aprovação): nível "crit" porque o error_log do Nginx repete a linha da
# requisição (inclusive o tracking_token) em falhas de upstream e NÃO pode ser redigido. As falhas
# continuam detectáveis pelo status 5xx no access_log (que é redigido) e pelos logs da aplicação.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    server_tokens off;

    # Pastas temporárias graváveis sem root (o contêiner roda com raiz somente leitura e /tmp em memória).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Log de acesso sem o tracking_token (ROADMAP 7.3, M20) -------------------------------------
    # O token vai no caminho da página (/r/:slug/pedido/:token) e da API (/api/v1/public/orders/:token).
    # Esta redação vale SÓ para o log do Nginx; a Cloudflare vê o caminho completo (ABERTO-19).
    map $request_uri $loggable_uri {
        ~^(?<pfx>/r/[^/]+/pedido/)[^/?]+(?<rest>.*)$        "${pfx}[redacted]${rest}";
        ~^(?<pfx>/api/v1/public/orders/)[^/?]+(?<rest>.*)$  "${pfx}[redacted]${rest}";
        default                                              $request_uri;
    }

    # Sem cookie, Referer, corpo nem User-Agent. "aop" mostra se a conexão veio da Cloudflare autenticada.
    log_format edge '$remote_addr [$time_iso8601] "$request_method $loggable_uri" $status '
                    '$body_bytes_sent $request_time aop=$ssl_client_verify';
    access_log /dev/stdout edge;

    # --- IP real do cliente (M10) ----------------------------------------------------------------
    # Só se confia em CF-Connecting-IP quando a conexão vem das faixas da Cloudflare.
    include /etc/nginx/snippets/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # --- TLS (M02/M04): 1.2 ou superior ------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Limites (M09, M17). Cada nível mais folgado que o seguinte: Cloudflare > Nginx > aplicação --
    limit_req_zone  $binary_remote_addr zone=web:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # 429 do Nginx NÃO vem em JSON: o frontend precisa tratar resposta que não seja JSON.
    limit_req_status  429;
    limit_conn_status 429;

    # --- Cabeçalhos globais (M11) ------------------------------------------------------------------
    # O Next define Referrer-Policy: no-referrer na página do token; este mapa mantém o valor do upstream
    # (uma única ocorrência) e usa o padrão nas demais respostas, inclusive as geradas pelo próprio Nginx.
    map $upstream_http_referrer_policy $edge_referrer_policy {
        default $upstream_http_referrer_policy;
        ""      "strict-origin-when-cross-origin";
    }

    include /etc/nginx/conf.d/*.conf;
}
