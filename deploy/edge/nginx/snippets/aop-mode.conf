# Modo do Authenticated Origin Pulls (M04). Troca de modo é uma tarefa própria, na ordem do plano:
#   F8-B6 a F8-B8: "optional" (aceita conexão sem certificado de cliente e registra o resultado em aop=...).
#   F8-B9:         "on" (recusa conexão sem o certificado de cliente da Cloudflare). Só depois de provar,
#                  pelo log (aop=SUCCESS em todo tráfego da Cloudflare), que o AOP funciona.
# Trocar para "on" antes disso derruba o site.
ssl_verify_client optional;
