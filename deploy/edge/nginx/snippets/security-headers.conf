# Cabeçalhos de segurança globais (M11). O Nginx é o dono; o Next define só os de rota (página do token).
# Incluído no bloco server; nenhum location define add_header, então todos herdam estes.
# HSTS: valor INICIAL curto (1 dia). Subir para 31536000 só depois da validação na F8-B13, pois o HSTS
# longo não tem volta. Sem includeSubDomains nem preload.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $edge_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Proteção contra embutir o site em frames (aplicada de fato; frame-ancestors não vale em Report-Only).
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# CSP em modo somente relatório (S-02). A API não tem endpoint de relatório, então as violações só
# aparecem no console do navegador; definir o destino antes de apertar a política.
# 'unsafe-inline' em script e estilo: o Next.js injeta scripts de hidratação; nonces ficam para depois.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.menubora.com.br; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
