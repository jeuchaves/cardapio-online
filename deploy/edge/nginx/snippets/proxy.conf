# Repasse ao web e à API (M10, M11, M19).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# SOBRESCREVE o X-Forwarded-For com o IP já restaurado por real_ip: valor enviado pelo cliente é descartado.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;

# Cookie, Origin e Set-Cookie passam sem alteração (a validação de Origin é da aplicação, ADR 0002).

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# O Referrer-Policy do upstream é reaplicado pelo mapa em security-headers.conf (uma única ocorrência).
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Powered-By;

# ID da requisição gerado AQUI ($request_id, aleatório) e repassado à API. O proxy_set_header substitui o
# X-Request-ID enviado pelo cliente (ABERTO-04, alternativa 3): a API nunca recebe identificador externo.
proxy_set_header X-Request-ID $request_id;
